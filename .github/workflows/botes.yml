name: Botes

on:
  schedule:
    - cron: '17 */3 * * *' # cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update-botes.mjs, .github/workflows/botes.yml]

permissions:
  contents: write

concurrency:
  group: botes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-botes.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- botes.json && git ls-files --error-unmatch botes.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add botes.json
          git commit -m "Botes actualizados"
          git push
